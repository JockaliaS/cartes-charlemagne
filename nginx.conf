# Cartes de visite numériques — Charlemagne Groupe
# Ce fichier remplace /etc/nginx/conf.d/default.conf dans l'image nginx:alpine.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript text/vcard text/plain;

    # Derrière un reverse proxy (Traefik/Coolify) : ne pas réécrire l'hôte/port
    # dans les redirections de répertoire.
    absolute_redirect off;
    server_tokens off;

    # --- Sécurité de base ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml text/vcard;

    # --- Anciennes URL ---
    # La carte vivait à /beatrice avant le classement par pôle.
    # Les liens et QR codes déjà partagés doivent continuer à fonctionner.
    # `=` (exact) l'emporte sur `^~`, qui l'emporte sur les regex : la vCard
    # garde donc sa propre redirection au lieu de retomber sur la page.
    location = /beatrice                { return 301 /immobilier/beatrice; }
    location = /beatrice/beatrice.vcf   { return 301 /immobilier/beatrice/beatrice.vcf; }
    location ^~ /beatrice/              { return 301 /immobilier/beatrice; }

    # --- vCards ---
    # .vcf n'est pas dans le mime.types de nginx : on déclare le type ici.
    # Combiné à `charset utf-8` + `charset_types`, nginx sert
    # "Content-Type: text/vcard; charset=utf-8".
    location ~* \.vcf$ {
        types { text/vcard vcf; }
        default_type text/vcard;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # --- Assets (photos de cartes, icônes, polices) : cache long ---
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- CSS / JS : cache court (fichiers non versionnés) ---
    location ~* \.(?:css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # --- Pages : URLs propres, /beatrice -> /beatrice/index.html ---
    # Le HTML n'est pas mis en cache pour que les mises à jour de carte
    # soient visibles immédiatement.
    # `$uri/index.html` est testé AVANT `$uri/` : sans cela nginx répondrait
    # une redirection 301 de /beatrice vers /beatrice/. On sert la page
    # directement, en 200, sur l'URL courte qui est celle qu'on partage.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }

    # --- Page d'erreur sobre ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Sondage de santé (Coolify / healthcheck Docker)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Interdire l'accès aux fichiers cachés (.gitkeep, etc.)
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
